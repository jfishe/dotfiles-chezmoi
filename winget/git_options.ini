; Git for Windows unattended-install answer file, used via
; `winget install --custom /LOADINF=<this file>` for the Git.Git package
; (see .chezmoidata/packages.yaml and run_onchange_install-packages.ps1.tmpl).
;
; Checked against install.iss for Git for Windows v2.56.0.3. Note that
; Components= is an exact list that replaces the installer's defaults, so
; re-check it when new components are added. Full option reference:
; https://github.com/git-for-windows/build-extra/blob/main/installer/install.iss
; Regenerate with:
; winget install --id Git.Git -e --force --interactive --scope machine `
;   --custom "/SAVEINF=new_options.ini"
[Setup]
Lang=default
; Dir=C:\Program Files\Git
Group=Git
NoIcons=0
SetupType=default
Components=ext,ext\shellhere,ext\guihere,gitlfs,assoc,assoc_sh,scalar
Tasks=
EditorOption=VIM
CustomEditorPath=
DefaultBranchOption=main
PathOption=CmdTools
SSHOption=OpenSSH
TortoiseOption=false
CURLOption=WinSSL
CRLFOption=LFOnly
BashTerminalOption=MinTTY
GitPullBehaviorOption=Rebase
UseCredentialManager=Enabled
PerformanceTweaksFSCache=Enabled
EnableSymlinks=Enabled
EnableFSMonitor=Disabled

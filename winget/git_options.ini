; Git for Windows unattended-install answer file, used via
; `winget install --custom /LOADINF=<this file>` for the Git.Git package
; (see .chezmoidata/packages.yaml and run_onchange_install-packages.ps1.tmpl).
;
; Generated as a starting point -- review before relying on it. Full option
; reference: https://github.com/git-for-windows/build-extra/blob/main/installer/install.iss
[Setup]
Lang=default
Dir=C:\Program Files\Git
Group=Git
NoIcons=0
SetupType=default
Components=ext,ext\shellhere,ext\guihere,assoc,assoc_sh
Tasks=
EditorOption=VIM
CustomEditorPath=
DefaultBranchOption=main
PathOption=Cmd
SSHOption=OpenSSH
TortoiseOption=false
CURLOption=OpenSSL
CRLFOption=CRLFAlways
BashTerminalOption=MinTTY
GitPullBehaviorOption=Rebase
UseCredentialManager=Enabled
PerformanceTweaksFSCache=Enabled
EnableSymlinks=Disabled
EnablePseudoConsoleSupport=Disabled
EnableFSMonitor=Disabled
